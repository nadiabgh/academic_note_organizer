{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="relative h-full">
    <div class="flex">
        <!-- Toolbar -->
        <div class="bg-white gap-3 fixed left-1/2  top-8 -translate-x-1/2 flex justify-center z-50 rounded-full shadow-xl px-4 py-1">
            <button onclick="toggleSidebar()" class="text-gray-600 p-2 transition">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
                </svg>
            </button>
            <a href="{% url 'edit_note' note.id %}" class="p-2">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L6.832 19.82a4.5 4.5 0 0 1-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 0 1 1.13-1.897L16.863 4.487Zm0 0L19.5 7.125" />
                </svg>
            </a>
            <a href="{% url 'delete_note' note.id %}" class="p-2">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                </svg>
            </a>
            <label for="imageUpload" class="p-2 cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
                </svg>
            </label>
            <label for="fileUpload" class="p-2 cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m18.375 12.739-7.693 7.693a4.5 4.5 0 0 1-6.364-6.364l10.94-10.94A3 3 0 1 1 19.5 7.372L8.552 18.32m.009-.01-.01.01m5.699-9.941-7.81 7.81a1.5 1.5 0 0 0 2.112 2.13" />
                </svg>
            </label>
        </div>
        <form id="uploadForm" method="POST" enctype="multipart/form-data" class="hidden">
            {% csrf_token %}
            <input id="imageUpload" type="file" name="image" accept="image/*">
            <input id="fileUpload" type="file" name="file">
        </form>
    </div>

    <!-- Note Container -->
    <div id="noteScroll" class="bg-slate-50 h-full overflow-y-auto">
        <div class="max-w-4xl mx-auto px-8 pb-12 pt-24">

            <!-- Title -->
            <div id="noteTitle" class="mb-6 transition-opacity duration-200">
                <h1 class="text-4xl font-bold text-gray-900 py-4px-10">{{ note.title }}</h1>
            </div>

            <!-- Note Sheets -->
            <div class="bg-white mt-6 rounded-xl shadow-sm px-6 py-8">
                <div class="whitespace-pre-wrap leading-8 text-gray-800">
                    {{note.content }}
                    {% if note.image %}
                        <img src="{{ note.image.url }}" alt="file" class="mt-6 rounded-xl">
                    {% endif %}
                    {% if note.file %}
                        <div class="mt-3">
                            <a href="{{ note.file.url }}" target="_blank" class="text-sm text-blue-500">
                                {{ note.file.name|cut:"notes/files/" }}
                            </a>
                        </div>
                    {% endif %}
                </div>
            </div>

        </div>
    </div>
</div>

    <script>

        //Sidebar Toggle
        function toggleSidebar() {
            const sidebar = document.querySelector('aside');
            const main = document.querySelector('main');
            if(sidebar.classList.contains('hidden')) {
                sidebar.classList.remove('hidden');
                main.classList.remove('w-full');
            } else {
                sidebar.classList.add('hidden');
                main.classList.add('w-full');
            }
        }

        //Note Title Animation
        const noteScroll = document.getElementById('noteScroll');
        const noteTitle = document.getElementById('noteTitle');
        noteScroll.addEventListener('scroll', function() {
            const scroll = Math.min(noteScroll.scrollTop, 120);
            noteTitle.style.opacity = 1 - scroll/120;
            noteTitle.style.transform = `translateY(-${scroll/3}px)`;
        });
        
        //Image and File Upload
        const imageUpload = document.getElementById("imageUpload");
        const fileUpload = document.getElementById("fileUpload");
        const uploadForm = document.getElementById("uploadForm");

        if (imageUpload && fileUpload && uploadForm) {
            imageUpload.addEventListener("change", () => {
                uploadForm.submit();
            });

            fileUpload.addEventListener("change", () => {
                uploadForm.submit();
            });
        };
    </script>

</div>
{% endblock %}

{% extends 'base.html'%}
{% load static %}

{% block content %}
<div class="max-w-4xl">

    <!-- Header -->
    <div class="flex items-center justify-between mb-8 gap-4">
        <h1 class="text-4xl font-bold text-gray-900">Courses</h1>
        <a href="{% url 'create_course' %}" class="bg-blue-400 hover:bg-blue-500 text-black rounded-lg block text-center font-medium px-4 py-1 h-fit ml-auto"> 
            + New 
        </a>
    </div>

    <!-- Total Courses Grid -->
    {% if courses %}
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-3 mb-8">
            {% for course in courses %}
                <div class="relative group">

                    <!-- Cards -->
                    <a href="{% url 'course_detail' course.id %}" class="course-card bg-white rounded-lg border border-gray-200 overflow-hidden mt-4">
                        <!-- Hover Buttons(edit and delete)-->
                        <div class="absolute flex top-2 right-2 gap-2 opacity-0 group-hover:opacity-100 transition-opacity duration-200 z-10">
                            <a href="{% url 'edit_course' course.id %}" class="bg-white rounded-full p-2 shadow hover:shadow-xl hover:bg-gray-100 transition-all" title="Edit">
                                ✏️
                            </a>
                            <a href="{% url 'delete_course' course.id %}" class="bg-white rounded-full p-2 shadow hover:bg-gray-100">
                                🗑️
                            </a>
                        </div>
                        <img src="{% static 'covers/Course.jpg'%}" alt="{{ course.title }}" class="w-full h-48 object-cover">
                        <p class="mt-4 font-semi-bold text-blue-900 text-center px-2">{{ course.title }}</p>
                        <div class="flex justify-between items-center text-sm text-gray-500">
                            <p class="mt-3 text-xs text-center text-gray-400 mb-2 ml-4">{{ course.created|date:"M d, Y" }}</p>
                        </div>
                    </a>
                </div>
            {% endfor %}
        </div>
    {% else %}
            <p class="text-gray-600 p-12 mb-6">No courses yet.Tap <span class="sont-bold">New</span> to create one!</p>
    {% endif %}
</div>

{% endblock %}

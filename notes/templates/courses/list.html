{% extends 'base.html'%}
{% load static %}

{% block content %}
<div class="w-full">

    <!-- Header -->
    <div class="flex items-center justify-between mb-8 gap-4 mt-12">
        <h1 class="text-4xl font-bold text-gray-900">Courses</h1>
        <a href="{% url 'create_course' %}" class="bg-blue-400 hover:bg-blue-500 text-black rounded-lg block text-center font-medium px-6 py-1 h-fit ml-auto"> 
            + New 
        </a>
    </div>

    <!-- Courses -->
    {% if courses %}
        <div class="grid grid-cols-4 md:grid-cols-5 lg:grid-cols-5 gap-3 mb-8">
            {% for course in courses %}
                <div class="relative group">

                    <!-- Edit/Delete buttons -->
                        <div class="absolute flex top-6 right-2 gap-2 opacity-0 group-hover:opacity-100 transition-opacity duration-200 z-10">
                            <a href="{% url 'edit_course' course.id %}" class="bg-white rounded-full p-2 shadow hover:shadow-xl hover:bg-gray-100 transition-all" title="Edit">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L6.832 19.82a4.5 4.5 0 0 1-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 0 1 1.13-1.897L16.863 4.487Zm0 0L19.5 7.125" />
                                </svg>
                            </a>
                            <a href="{% url 'delete_course' course.id %}" class="bg-white rounded-full p-2 shadow-xl hover:bg-gray-100">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                                </svg>
                            </a>
                        </div>

                    <!-- Course Cards -->
                    <a href="{% url 'course_detail' course.id %}" class="block bg-white rounded-lg border border-gray-200 overflow-hidden mt-4 transition duration-200 ease-out hover:-translate-y-2 hover:shadow-xl hover:border-blue-300 active:-translate-y-2">
                        <img src="{% static 'covers/Course.jpg'%}" alt="{{ course.title }}" class="w-full h-48 object-cover">
                        <p class="mt-4 font-semi-bold text-blue-900 text-center px-2">{{ course.title }}</p>
                        <div class="flex justify-between items-center text-sm text-gray-500">
                            <p class="mt-3 text-xs text-center text-gray-400 mb-2 ml-4">{{ course.created|date:"M d, Y" }}</p>
                        </div>
                    </a>
                </div>
            {% endfor %}
        </div>
    {% else %}
            <img src="{% static 'covers/Notebook.jpg' %}" alt="Notebook" class="mt-18 w-80 ml-80">
            <p class="text-xl text-gray-600 mb-6 ml-90">Tap <strong>New</strong> to create a Course!</p>
    {% endif %}
</div>

{% endblock %}

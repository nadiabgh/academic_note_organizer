{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Notanizer</title>
        <meta name="viewport" content="width=device-width initial-scale=1.0"/>
        <meta charset="UTF-8"/>
        <link rel="stylesheet" href=" {% static 'style.css' %}"/>
        <link rel="stylesheet" href=" {% static 'output.css' %}"/>
    </head>
    <body class="flex items-center justify-center min-h-screen bg-slate-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-8">
            <div class="flex flex-col text-center mb-8">
                <img src="{% static 'Logo/logo.jpg'%}" alt="Logo" class="flex justify-center h-48 w-48 ml-22">
                <p class="text-blue-900">Organize • Learn • Succeed</p>
            </div>
            <form method="POST" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label for="id_username" class="block w-full text-sm font-medium text-gray-500 mb-4">
                        Username
                    </label>
                    {{ form.username }}
                    {% if form.username.errors %}
                        <p class="text-red-500 text-sm mt-2">{{ form.username.errors }}</p>
                    {% endif %}
                </div>
                <div>
                    <label for="id_password" class="block w-full text-sm font-medium text-gray-500 mt-4">
                        Password
                    </label>
                    {{ form.password }}
                    {% if form.password.errors %}
                        <p class="text-red-500 text-sm mt-4">
                            {{ form.password.errors }}
                        </p>
                    {% endif %}
                </div>

                <div class="flex justify-center pt-4">
                    <button type="submit" class="w-48 bg-blue-500 text-white font-semi-bold hover:bg-blue-600 py-2 px-4 rounded-lg">
                        Login
                    </button>
                </div>

                <p class="text-center text-sm text-gray-600 pt-2">
                    Don't have an account?
                    <a href="{% url 'signup' %}" class="font-medium text-blue-500 hover:text-blur-600">
                        Sign Up
                    </a>
                </p>
            </form>
        </div>
    </body>
</html>
